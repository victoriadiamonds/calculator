<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Victoria Diamonds Jewelry Price Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Jewelry Calculator</h1>
    <p class="tagline">Luxury collection pricing</p>

    <div class="row">
      <div style="flex:1">
        <label for="collection">Collection</label>
        <select id="collection">
          <option value="dailySparkle">Daily Sparkle</option>
          <option value="occasionWear">Occasion Wear</option>
          <option value="foreverBond">Forever Bond</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="typeFilter">Type</label>
        <select id="typeFilter">
          <option value="all" selected>All Types</option>
          <option value="ring">Rings</option>
          <option value="necklace">Necklaces</option>
          <option value="earrings">Earrings</option>
          <option value="bracelet">Bracelets</option>
          <option value="brooch">Brooch</option>
          <option value="tiara">Tiara</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="product">Choose product / design</label>
        <select id="product"></select>
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="modelName">Model name</label>
        <input id="modelName" placeholder="Auto-filled from selection" readonly style="background:rgba(255,255,255,0.05);color:inherit" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="metal">Metal</label>
        <select id="metal">
          <option value="gold">Gold</option>
          <option value="silver">Silver</option>
          <option value="platinum">Platinum</option>
        </select>
      </div>
      <div style="flex:1" id="metalExtras">
        <!-- Karat / purity controls injected here -->
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Main Diamond
        <button type="button" class="diamond-reset" data-index="0" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq0">Diamond quality</label>
          <select id="dq0" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>
        </div>
        <div style="flex:1">
          <label for="dc0">Diamond carat</label>
          <select id="dc0" class="diamond-carat"></select>
        </div>
        <div style="flex:1">
          <label for="dqt0">Quantity</label>
          <input id="dqt0" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Diamond 2
        <button type="button" class="diamond-reset" data-index="1" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq1">Diamond quality</label>
          <select id="dq1" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>
        </div>
        <div style="flex:1">
          <label for="dc1">Diamond carat</label>
          <select id="dc1" class="diamond-carat"></select>
        </div>
        <div style="flex:1">
          <label for="dqt1">Quantity</label>
          <input id="dqt1" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Diamond 3
        <button type="button" class="diamond-reset" data-index="2" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq2">Diamond quality</label>
          <select id="dq2" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>

        </div>
        <div style="flex:1">
          <label for="dqt2">Quantity</label>
          <input id="dqt2" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Diamond 4
        <button type="button" class="diamond-reset" data-index="3" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">

          <select id="dq3" class="diamond-quality">

        </div>

          <label for="dqt3">Quantity</label>
          <input id="dqt3" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" step="1" min="1" value="1" />
      </div>
      <div style="flex:1">
        <label for="discount">Discount (%)</label>
        <input id="discount" type="number" step="1" min="0" max="100" value="0" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="profit">Profit margin (%)</label>
        <input id="profit" type="number" step="1" min="0" value="0" />
      </div>
      <div style="flex:1">
        <label for="notes">Notes (optional)</label>
        <input id="notes" placeholder="Special requests" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="designFee">Design customization fee (£)</label>
        <input id="designFee" type="number" step="1" min="0" value="0" placeholder="e.g. 150" />
      </div>
      <div style="flex:1">
        <label class="label-placeholder">&nbsp;</label>
        <div class="tier-badge-wrapper" id="tierBadgeWrapper"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="calc" class="btn">Calculate price</button>
      <button id="reset" class="btn secondary">Reset</button>
    </div>

    <div id="liveTotal" class="live-total muted" aria-live="polite"></div>

    <div id="out" class="result" aria-live="polite">
      <div class="muted">Choose product and options, then press Calculate.</div>
    </div>
  </main>

  <div id="resultPopup" class="result-popup" hidden>
    <div class="result-popup-content" role="dialog" aria-modal="true" aria-labelledby="resultPopupTitle">
      <div class="result-popup-header">
        <h3 id="resultPopupTitle">Order Summary</h3>
        <button type="button" id="closeResultPopup" class="btn secondary small-btn">Close</button>
      </div>
      <div id="resultPopupBody" class="result"></div>
      <div id="priceBreakdown" class="breakdown" hidden></div>
      <div class="buttons" style="margin-top:16px">
        <button id="proceedPaymentFromPopup" class="btn">Proceed to Payment</button>
        <button type="button" id="checkBreakdownBtn" class="btn secondary">Check breakdown</button>
      </div>
    </div>
  </div>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <div id="modalBody">
        <h2>Checkout</h2>
        <div class="modal-body">
          <div class="form-group">
            <label>Order Total: <strong id="totalPrice">—</strong></label>
          </div>

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="John Doe" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="john@example.com" />
          </div>

          <div class="form-group" id="airwallexDropinContainer" style="margin-top:16px;">

            <div id="airwallex-dropin"></div>
          </div>

          <div class="buttons" style="margin-top:24px">

            <button id="cancelCheckout" class="btn secondary">Cancel</button>
          </div>

          <div id="paymentStatus" class="muted" style="margin-top:12px;text-align:center"></div>
        </div>
      </div>
    </div>
  </div>

      const hasFraction = Math.abs(rounded - Math.round(rounded)) > 0.001;

    function getCollectionName(id){
      const names = { dailySparkle: 'Daily Sparkle', occasionWear: 'Occasion Wear', foreverBond: 'Forever Bond' };
      return names[id] || id;
    }

    function getProductInherentTier(collection, productId){
      const tiers = PRODUCTS_BY_COLLECTION[collection];
      for(var tierKey in tiers){
        if(tiers.hasOwnProperty(tierKey)){
          var found = tiers[tierKey].find(function(p){ return p.id === productId; });
          if(found) return tierKey;
        }
      }
      return null;
    }

    function getProductsForCurrentSelections(){
      const collection = document.getElementById('collection').value;
      const typeFilter = document.getElementById('typeFilter').value;
      var allProducts = [];
      const tiers = PRODUCTS_BY_COLLECTION[collection] || {};
      for(var tierKey in tiers){
        if(tiers.hasOwnProperty(tierKey)){
          var tierProducts = tiers[tierKey];
          if(typeFilter && typeFilter !== 'all'){
            tierProducts = tierProducts.filter(function(p){ return p.type === typeFilter; });
          }
          allProducts = allProducts.concat(tierProducts);
        }
      }
      return allProducts;
    }

    function getCurrentProduct(){
      const products = getProductsForCurrentSelections();
      const pid = document.getElementById('product').value;
      return products.find(function(p){ return p.id === pid; }) || products[0] || null;
    }

    function isNonCalculatedType(type){
      return NON_CALCULATED_TYPES.indexOf(type) !== -1;
    }

    function getMetalPricePerGram(){
      const metal = document.getElementById('metal').value;
      if(metal === 'gold'){

      }

        return BASE.silver * (purity/1000);

      return BASE.platinum;

    function getDiamondEntries(){
      var entries = [];
      for(var i = 0; i < 4; i++){
        var q = document.getElementById('dq' + i).value;
        var c = document.getElementById('dc' + i).value || '0';
        var qty = Number(document.getElementById('dqt' + i).value) || 0;
        var caratNum = Number(c) || 0;
        var price = 0;
        var unpriced = false;
        if(caratNum > 0){
          var tierPrices = DIAMOND_PRICES[q] || {};
          var rawPrice = tierPrices[c];
          if(rawPrice === null || rawPrice === undefined){
            unpriced = true;
            price = 0;
          } else {
            price = rawPrice;
          }
        }
        entries.push({
          quality: q,
          carat: c,
          caratNum: caratNum,
          qty: qty,
          price: price,
          unpriced: unpriced,
          total: price * qty
        });
      }
      return entries;
    }

    function computePricing(){
      const products = getProductsForCurrentSelections();
      const pid = document.getElementById('product').value;
      const prod = products.find(function(p){ return p.id === pid; }) || products[0];
      if(!prod) return null;

      const collection = document.getElementById('collection').value;
      const tierKey = getProductInherentTier(collection, prod.id) || 'essentials';

      if(isNonCalculatedType(prod.type)){
        return {
          priceOnRequest: true,
          prod: prod,
          collection: collection,
          tierKey: tierKey,
          type: prod.type
        };
      }

      let packageKey = TIER_TO_PACKAGE[tierKey] || 'basic';
      if(prod.type === 'bracelet'){
        packageKey = 'basic';
      }
      const metal = document.getElementById('metal').value;

      let metalKey;
      if(metal === 'platinum'){
        metalKey = 'platinum';
      } else if(metal === 'gold'){
        metalKey = document.getElementById('karat').value + 'K';
      } else {
        metalKey = '9K';
      }

      const designComplexityFee = (PRICING_PACKAGE_MATRIX[packageKey] && PRICING_PACKAGE_MATRIX[packageKey][metalKey]) || 0;
      const ringPrice = designComplexityFee;

      const entries = getDiamondEntries();
      let diamondPrice = 0;
      let hasUnpricedDiamond = false;
      entries.forEach(function(e){
        diamondPrice += e.total;
        if(e.caratNum > 0 && e.unpriced) hasUnpricedDiamond = true;
      });

      const qty = Number(document.getElementById('quantity').value) || 1;
      const profitPct = Number(document.getElementById('profit').value) || 0;
      const designFee = Number(document.getElementById('designFee').value) || 0;

      let discount = Number(document.getElementById('discount').value) || 0;
      discount = Math.min(Math.max(discount, 0), 100);

      const subtotal = ringPrice + diamondPrice + designFee;
      const profitAmount = subtotal * (profitPct / 100);
      const unitTotal = subtotal + profitAmount;
      const grandTotal = unitTotal * qty;
      const discountAmount = grandTotal * (discount / 100);
      const finalTotal = grandTotal - discountAmount;

      return {
        priceOnRequest: false,
        prod: prod,
        collection: collection,
        tierKey: tierKey,
        packageKey: packageKey,
        metal: metal,
        metalKey: metalKey,
        designComplexityFee: designComplexityFee,
        ringPrice: ringPrice,
        entries: entries,
        diamondPrice: diamondPrice,
        hasUnpricedDiamond: hasUnpricedDiamond,
        qty: qty,
        profitPct: profitPct,
        designFee: designFee,
        discount: discount,
        subtotal: subtotal,
        profitAmount: profitAmount,
        unitTotal: unitTotal,
        grandTotal: grandTotal,
        discountAmount: discountAmount,
        finalTotal: finalTotal
      };
    }

    function updateLiveTotal(){
      const el = document.getElementById('liveTotal');
      if(!el) return;
      const p = computePricing();
      if(!p){ el.textContent = ''; return; }
      if(p.priceOnRequest){
        el.textContent = (TYPE_LABELS[p.type] || 'This piece') + ' is priced on request — not auto-calculated.';
        return;
      }
      var text = 'Estimated total: ' + formatGBP(p.finalTotal);
      if(p.discount > 0){
        text += ' (after ' + p.discount + '% discount)';
      }
      if(p.hasUnpricedDiamond){
        text += ' — ⚠ one or more diamonds have no set price yet';
      }
      el.textContent = text;
    }

      const qualityLabels = { luxe: 'Luxe', select: 'Select' };

      var html = '<div class="result-tier-badge" style="--tier-color:' + tierInfo.color + '">' + tierInfo.label + '</div>' +
        '<div><strong>Collection:</strong> ' + collectionName + '</div>' +
        '<div><strong>Product:</strong> ' + prod.name + '</div>' +
        '<div><strong>Model name:</strong> ' + (document.getElementById('modelName').value.trim() || '(none)') + '</div>' +
        '<div><strong>Metal:</strong> ' + metalLabel + '</div>' +
        '<div><strong>Design/labor fee:</strong> ' + formatGBP(p.designComplexityFee) + '</div>' +
        '<div><strong>Base price (design):</strong> ' + formatGBP(p.ringPrice) + '</div>';

      p.entries.forEach(function(e, idx){

          if(e.unpriced){
            html += '<div class="small"><strong>' + DIAMOND_SECTION_NAMES[idx] + ':</strong> ' + qualityLabels[e.quality] + ', ' + e.carat + ' ct × ' + e.qty + ' — ⚠ price not set for this size, contact us for a quote</div>';
          } else {
            html += '<div class="small"><strong>' + DIAMOND_SECTION_NAMES[idx] + ':</strong> ' + qualityLabels[e.quality] + ', ' + e.carat + ' ct × ' + e.qty + ' = ' + formatGBP(e.total) + '</div>';
          }
        }
      });

      if(prod.type === 'earrings'){
        var totalCts = 0;
        p.entries.forEach(function(e){
          if(e.caratNum > 0) totalCts += e.caratNum * e.qty;
        });
        if(totalCts > 0){
          html += '<div class="small"><strong>Diamond weight:</strong> ' + (totalCts / 2) + ' ct per earring / ' + totalCts + ' ct per pair</div>';
        }
      }

      html += '<div><strong>Diamond cost (all):</strong> ' + formatGBP(p.diamondPrice) + '</div><hr />' +
        (p.designFee > 0 ? '<div><strong>Design customization:</strong> ' + formatGBP(p.designFee) + '</div>' : '') +
        '<div><strong>Subtotal (per unit):</strong> ' + formatGBP(p.subtotal) + '</div>' +
        '<div><strong>Profit (' + p.profitPct + '%):</strong> ' + formatGBP(p.profitAmount) + '</div>' +
        '<div><strong>Unit total:</strong> ' + formatGBP(p.unitTotal) + '</div>' +
        '<div><strong>Quantity:</strong> ' + p.qty + '</div>' +
        '<div><strong>Total before discount:</strong> ' + formatGBP(p.grandTotal) + '</div>';

      if(p.discount > 0){
        html += '<div><strong>Discount (' + p.discount + '%):</strong> −' + formatGBP(p.discountAmount) + '</div>';
      }

      html += '<div style="font-size:1.1rem;margin-top:12px"><strong>Final total: ' + formatGBP(p.finalTotal) + '</strong></div>' +
        '<div class="small" style="margin-top:8px">Notes: ' + (document.getElementById('notes').value.trim() || '-') + '</div>';

    function buildBreakdownMarkup(p){
      const packageLabels = { basic: 'Essential design', signature: 'Signature design' };
      const qualityLabels = { luxe: 'Luxe', select: 'Select' };
      let lines = '<div class="breakdown-title">How this was calculated</div>';
      lines += '<div class="breakdown-line"><span>Design/labor fee — ' + (packageLabels[p.packageKey] || p.packageKey) + '</span><span>' + formatGBP(p.designComplexityFee) + '</span></div>';
      p.entries.forEach(function(e, idx){
        if(e.caratNum > 0){
          if(e.unpriced){
            lines += '<div class="breakdown-line"><span>' + DIAMOND_SECTION_NAMES[idx] + ' — ' + qualityLabels[e.quality] + ', ' + e.carat + 'ct × ' + e.qty + '</span><span>⚠ unpriced</span></div>';
          } else {
            lines += '<div class="breakdown-line"><span>' + DIAMOND_SECTION_NAMES[idx] + ' — ' + qualityLabels[e.quality] + ', ' + e.carat + 'ct × ' + e.qty + '</span><span>' + formatGBP(e.total) + '</span></div>';
          }
        }
      });
      if(p.designFee > 0){
        lines += '<div class="breakdown-line"><span>Design customization</span><span>' + formatGBP(p.designFee) + '</span></div>';
      }
      lines += '<hr />';
      lines += '<div class="breakdown-formula">Base price = ' + formatGBP(p.designComplexityFee) + ' (design) = <strong>' + formatGBP(p.ringPrice) + '</strong></div>';
      lines += '<div class="breakdown-formula">Subtotal = ' + formatGBP(p.ringPrice) + ' + ' + formatGBP(p.diamondPrice) + (p.designFee > 0 ? ' + ' + formatGBP(p.designFee) : '') + ' = <strong>' + formatGBP(p.subtotal) + '</strong></div>';
      lines += '<div class="breakdown-formula">Profit (' + p.profitPct + '%) = ' + formatGBP(p.subtotal) + ' × ' + p.profitPct + '% = <strong>' + formatGBP(p.profitAmount) + '</strong></div>';
      lines += '<div class="breakdown-formula">Unit total = ' + formatGBP(p.subtotal) + ' + ' + formatGBP(p.profitAmount) + ' = <strong>' + formatGBP(p.unitTotal) + '</strong></div>';
      lines += '<div class="breakdown-formula">Grand total = ' + formatGBP(p.unitTotal) + ' × ' + p.qty + ' = <strong>' + formatGBP(p.grandTotal) + '</strong></div>';
      if(p.discount > 0){
        lines += '<div class="breakdown-formula">Discount (' + p.discount + '%) = ' + formatGBP(p.grandTotal) + ' × ' + p.discount + '% = −<strong>' + formatGBP(p.discountAmount) + '</strong></div>';
        lines += '<div class="breakdown-formula">Final total = ' + formatGBP(p.grandTotal) + ' − ' + formatGBP(p.discountAmount) + ' = <strong>' + formatGBP(p.finalTotal) + '</strong></div>';
      } else {
        lines += '<div class="breakdown-formula">Final total = <strong>' + formatGBP(p.finalTotal) + '</strong></div>';
      }
      return lines;
    }

    function calculate(){
      const p = computePricing();
      if(!p) return;

      const proceedBtn = document.getElementById('proceedPaymentFromPopup');
      const breakdownBtn = document.getElementById('checkBreakdownBtn');
      const breakdownPanel = document.getElementById('priceBreakdown');

      if(p.priceOnRequest){
        currentOrderTotal = 0;
        currentIsPriceOnRequest = true;

        const out = document.getElementById('out');
        out.innerHTML = '<div class="muted">This piece is priced on request — see the summary window.</div>';

        const popupBody = document.getElementById('resultPopupBody');
        popupBody.innerHTML = buildPriceOnRequestMarkup(p.prod, p);

        breakdownPanel.hidden = true;
        breakdownPanel.innerHTML = '';
        breakdownBtn.hidden = true;

        proceedBtn.disabled = true;
        proceedBtn.textContent = 'Contact us for a quote';

        document.getElementById('resultPopup').hidden = false;
        document.getElementById('totalPrice').textContent = 'On request';
        return;
      }

      currentOrderTotal = p.finalTotal;
      currentIsPriceOnRequest = false;

      const out = document.getElementById('out');
      out.innerHTML = '<div class="muted">Your quote is ready in the floating summary window.</div>';

      const popupBody = document.getElementById('resultPopupBody');
      popupBody.innerHTML = buildResultMarkup(p.prod, p);

      breakdownPanel.innerHTML = buildBreakdownMarkup(p);
      breakdownPanel.hidden = true;
      breakdownBtn.hidden = false;
      breakdownBtn.textContent = 'Check breakdown';

      proceedBtn.disabled = false;
      proceedBtn.textContent = 'Proceed to Payment';

      document.getElementById('resultPopup').hidden = false;
      document.getElementById('totalPrice').textContent = formatGBP(p.finalTotal);
    }

    async function initializeAirwallexDropin(clientSecret) {
      if (!window.AirwallexComponentsSDK) {
        throw new Error('Airwallex SDK not loaded');
      }

      const container = document.getElementById('airwallex-dropin');
      container.innerHTML = '';

      try {
        await window.AirwallexComponentsSDK.init({
          env: (window.AIRWALLEX_ENV === 'production') ? 'prod' : 'demo',
          enabledElements: ['payments']
        });
        airwallexDropin = await window.AirwallexComponentsSDK.createElement('dropIn', {
          intentId: currentPaymentIntent.paymentIntentId,
          clientSecret: clientSecret,
          currency: 'GBP'
        });
        airwallexDropin.mount('airwallex-dropin');
        airwallexDropin.on('ready', () => {
          document.getElementById('paymentStatus').textContent = 'Enter your payment details below.';
          document.getElementById('submitPayment').disabled = true;
        });
        airwallexDropin.on('success', () => {
          document.getElementById('paymentStatus').textContent = 'Payment successful. Confirming your order…';
          document.getElementById('submitPayment').disabled = true;
        });
        airwallexDropin.on('error', (error) => {
          console.error('Airwallex Drop-in error:', error);
          document.getElementById('paymentStatus').textContent = 'Payment error. Please review your details and try again.';
        });
      } catch (error) {
        console.error('Failed to initialize Airwallex Drop-in:', error);
        document.getElementById('paymentStatus').textContent = 'Unable to load payment form. Please try again.';
        throw error;
      }
    }

    async function createPaymentIntent() {
      const orderData = getOrderDataForPayment();
      if (!orderData) {
        throw new Error('Invalid order data');
      }

      const status = document.getElementById('paymentStatus');
      status.textContent = 'Creating payment session...';

      try {
        const resp = await fetch('/create-payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const json = await resp.json();

        if (!resp.ok) {
          throw new Error(json.error || 'Failed to create payment intent');
        }

        currentPaymentIntent = {
          paymentIntentId: json.paymentIntentId,
          clientSecret: json.clientSecret,
          merchantOrderId: json.merchantOrderId,
          amount: json.amount
        };

        return currentPaymentIntent;
      } catch (error) {
        console.error('PaymentIntent creation failed:', error);
        status.textContent = 'Unable to start payment. Please try again.';
        throw error;
      }
    }

    async function processPayment() {
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const status = document.getElementById('paymentStatus');

      if (!name || !email) {
        status.textContent = 'Please enter name and email.';
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = 'Please enter a valid email address.';
        return;
      }

      if (currentIsPriceOnRequest) {
        status.textContent = 'This item is priced on request and cannot be paid online.';
        return;
      }

      try {
        // Create PaymentIntent if not already created or if amount changed
        if (!currentPaymentIntent) {
          await createPaymentIntent();
        }

        // Initialize Drop-in with client secret
        if (currentPaymentIntent && currentPaymentIntent.clientSecret) {
          await initializeAirwallexDropin(currentPaymentIntent.clientSecret);
        }
      } catch (error) {
        console.error('Payment processing error:', error);
        status.textContent = 'Error starting payment: ' + error.message;
      }
    }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jewelry Price Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Jewelry Calculator</h1>
    <p class="tagline">Luxury collection pricing</p>

    <div class="row">
      <div style="flex:1">
        <label for="collection">Collection</label>
        <select id="collection">
          <option value="dailySparkle">Daily Sparkle</option>
          <option value="occasionWear">Occasion Wear</option>
          <option value="foreverBond">Forever Bond</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="typeFilter">Type</label>
        <select id="typeFilter">
          <option value="all" selected>All Types</option>
          <option value="ring">Rings</option>
          <option value="necklace">Necklaces</option>
          <option value="earrings">Earrings</option>
          <option value="bracelet">Bracelets</option>
          <option value="brooch">Brooch</option>
          <option value="tiara">Tiara</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="product">Choose product / design</label>
        <select id="product"></select>
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="modelName">Model name</label>
        <input id="modelName" placeholder="Auto-filled from selection" readonly style="background:rgba(255,255,255,0.05);color:inherit" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="metal">Metal</label>
        <select id="metal">
          <option value="gold">Gold</option>
          <option value="silver">Silver</option>
          <option value="platinum">Platinum</option>
        </select>
      </div>
      <div style="flex:1" id="metalExtras">
        <!-- Karat / purity controls injected here -->
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Main Diamond
        <button type="button" class="diamond-reset" data-index="0" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq0">Diamond quality</label>
          <select id="dq0" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>
        </div>
        <div style="flex:1">
          <label for="dc0">Diamond carat</label>
          <select id="dc0" class="diamond-carat"></select>
        </div>
        <div style="flex:1">
          <label for="dqt0">Quantity</label>
          <input id="dqt0" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Diamond 2
        <button type="button" class="diamond-reset" data-index="1" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq1">Diamond quality</label>
          <select id="dq1" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>
        </div>
        <div style="flex:1">
          <label for="dc1">Diamond carat</label>
          <select id="dc1" class="diamond-carat"></select>
        </div>
        <div style="flex:1">
          <label for="dqt1">Quantity</label>
          <input id="dqt1" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Diamond 3
        <button type="button" class="diamond-reset" data-index="2" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq2">Diamond quality</label>
          <select id="dq2" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>
        </div>
        <div style="flex:1">
          <label for="dc2">Diamond carat</label>
          <select id="dc2" class="diamond-carat"></select>
        </div>
        <div style="flex:1">
          <label for="dqt2">Quantity</label>
          <input id="dqt2" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="diamond-block">
      <div class="diamond-section-title">
        Diamond 4
        <button type="button" class="diamond-reset" data-index="3" title="Reset this diamond">↺</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label for="dq3">Diamond quality</label>
          <select id="dq3" class="diamond-quality">
            <option value="select" selected>Select</option>
            <option value="luxe">Luxe</option>
          </select>
        </div>
        <div style="flex:1">
          <label for="dc3">Diamond carat</label>
          <select id="dc3" class="diamond-carat"></select>
        </div>
        <div style="flex:1">
          <label for="dqt3">Quantity</label>
          <input id="dqt3" class="diamond-qty" type="number" step="1" min="1" value="1" />
        </div>
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" step="1" min="1" value="1" />
      </div>
      <div style="flex:1">
        <label for="discount">Discount (%)</label>
        <input id="discount" type="number" step="1" min="0" max="100" value="0" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="profit">Profit margin (%)</label>
        <input id="profit" type="number" step="1" min="0" value="20" />
      </div>
      <div style="flex:1">
        <label for="notes">Notes (optional)</label>
        <input id="notes" placeholder="Special requests" />
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label for="designFee">Design customization fee (£)</label>
        <input id="designFee" type="number" step="1" min="0" value="0" placeholder="e.g. 150" />
      </div>
      <div style="flex:1">
        <label class="label-placeholder">&nbsp;</label>
        <div class="tier-badge-wrapper" id="tierBadgeWrapper"></div>
      </div>
    </div>

    <div class="buttons">
      <button id="calc" class="btn">Calculate price</button>
      <button id="reset" class="btn secondary">Reset</button>
    </div>

    <div id="liveTotal" class="live-total muted" aria-live="polite"></div>

    <div id="out" class="result" aria-live="polite">
      <div class="muted">Choose product and options, then press Calculate.</div>
    </div>
  </main>

  <div id="resultPopup" class="result-popup" hidden>
    <div class="result-popup-content" role="dialog" aria-modal="true" aria-labelledby="resultPopupTitle">
      <div class="result-popup-header">
        <h3 id="resultPopupTitle">Order Summary</h3>
        <button type="button" id="closeResultPopup" class="btn secondary small-btn">Close</button>
      </div>
      <div id="resultPopupBody" class="result"></div>
      <div id="priceBreakdown" class="breakdown" hidden></div>
      <div class="buttons" style="margin-top:16px">
        <button id="proceedPaymentFromPopup" class="btn">Proceed to Payment</button>
        <button type="button" id="checkBreakdownBtn" class="btn secondary">Check breakdown</button>
      </div>
    </div>
  </div>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <div id="modalBody">
        <h2>Checkout</h2>
        <div class="modal-body">
          <div class="form-group">
            <label>Order Total: <strong id="totalPrice">—</strong></label>
          </div>

          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="John Doe" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="john@example.com" />
          </div>

          <div class="buttons" style="margin-top:24px">
            <button id="submitPayment" class="btn">Pay with Stripe</button>
            <button id="cancelCheckout" class="btn secondary">Cancel</button>
          </div>

          <div id="paymentStatus" class="muted" style="margin-top:12px;text-align:center"></div>
        </div>
      </div>
    </div>
  </div>

    let currentOrderTotal = 0;
    let currentIsPriceOnRequest = false;

    function formatGBP(v){ return '£' + Math.round(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0}); }

    function getCollectionName(id){
      const names = { dailySparkle: 'Daily Sparkle', occasionWear: 'Occasion Wear', foreverBond: 'Forever Bond' };
      return names[id] || id;
    }

    // Find which tier a product belongs to within a collection
    function getProductInherentTier(collection, productId){
      const tiers = PRODUCTS_BY_COLLECTION[collection];
      for(var tierKey in tiers){
        if(tiers.hasOwnProperty(tierKey)){
          var found = tiers[tierKey].find(function(p){ return p.id === productId; });
          if(found) return tierKey;
        }
      }
      return null;
    }

    // Return ALL products from all tiers for the selected collection,
    // optionally filtered by the jewelry type selected in the Type dropdown.
    function getProductsForCurrentSelections(){
      const collection = document.getElementById('collection').value;
      const typeFilter = document.getElementById('typeFilter').value;
      var allProducts = [];
      const tiers = PRODUCTS_BY_COLLECTION[collection] || {};
      for(var tierKey in tiers){
        if(tiers.hasOwnProperty(tierKey)){
          var tierProducts = tiers[tierKey];
          if(typeFilter && typeFilter !== 'all'){
            tierProducts = tierProducts.filter(function(p){ return p.type === typeFilter; });
          }
          allProducts = allProducts.concat(tierProducts);
        }
      }
      return allProducts;
    }

    function getCurrentProduct(){
      const products = getProductsForCurrentSelections();
      const pid = document.getElementById('product').value;
      return products.find(function(p){ return p.id === pid; }) || products[0] || null;
    }

    function isNonCalculatedType(type){
      return NON_CALCULATED_TYPES.indexOf(type) !== -1;
    }

    function renderTierBadge(){
      const collection = document.getElementById('collection').value;
      const prod = getCurrentProduct();
      var tierKey = 'essentials';
      if(prod){
        tierKey = getProductInherentTier(collection, prod.id) || 'essentials';
      }
      const wrapper = document.getElementById('tierBadgeWrapper');
      const tierInfo = TIERS[tierKey];
      wrapper.innerHTML = '<span class="tier-badge" style="--tier-color:' + tierInfo.color + '">' + tierInfo.label + '</span>';
    }

    function populateProducts(){
      const products = getProductsForCurrentSelections();
      var sel = document.getElementById('product');
      sel.innerHTML = '';
      if(!products || products.length === 0){
        var opt = document.createElement('option');
        opt.textContent = '— No products —';
        sel.appendChild(opt);
      } else {
        products.forEach(function(p){
          // Find which tier group this product belongs to
          const collection = document.getElementById('collection').value;
          const tierKey = getProductInherentTier(collection, p.id) || '';
          const tierInfo = TIERS[tierKey];
          const tierSuffix = tierInfo ? ' — ' + tierInfo.label.replace(/[✦◆◈]\s*/g, '') : '';
          const typeSuffix = TYPE_LABELS[p.type] ? ' (' + TYPE_LABELS[p.type] + ')' : '';
          var opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name + typeSuffix + tierSuffix;
          sel.appendChild(opt);
        });
      }
      renderProductInfo();
    }

    function updateModelName(){
      const prod = getCurrentProduct();
      if(prod){
        const collection = document.getElementById('collection').value;
        const tierKey = getProductInherentTier(collection, prod.id) || 'essentials';
        const tierInfo = TIERS[tierKey];
        document.getElementById('modelName').value = prod.name + ' (' + tierInfo.tierLabel + ')';
      } else {
        document.getElementById('modelName').value = '';
      }
    }

// Apply a product's diamond preset (if any) to the diamond section controls.
    // Used for products with predefined diamond requirements (earrings, necklaces, bracelets).
    // Products without a preset leave diamonds untouched.
    function applyDiamondPreset(preset){
      if(!preset) return;
      // Reset all four diamond sections to defaults, then apply this product's preset
      for(var i = 0; i < 4; i++){
        document.getElementById('dq' + i).value = 'select';
        document.getElementById('dc' + i).value = '0';
        document.getElementById('dqt' + i).value = '1';
      }
      // Set the first diamond section to the preset values
      document.getElementById('dq0').value = preset.q || 'select';
      document.getElementById('dc0').value = String(preset.c || '0');
      document.getElementById('dqt0').value = String(preset.qty != null ? preset.qty : 1);
      updateLiveTotal();
    }

    function renderProductInfo(){
      const prod = getCurrentProduct();
      if(prod){
        document.getElementById('product').dataset.weight = prod.weight;
        document.getElementById('product').dataset.labor = prod.labor;
        document.getElementById('product').dataset.type = prod.type;
      }
      applyDiamondPreset(prod && prod.diamondPreset);
      renderTierBadge();
      updateModelName();
    }

    function renderMetalExtras(){
      const metal = document.getElementById('metal').value;
      const container = document.getElementById('metalExtras');
      container.innerHTML = '';
      if(metal === 'gold'){
        const label = document.createElement('label');
        label.textContent = 'Gold karat';
        const sel = document.createElement('select');
        sel.id = 'karat';
        [9,14,18,22].forEach(function(k){
          const o=document.createElement('option');
          o.value=k;
          o.textContent = k+'K';
          sel.appendChild(o);
        });
        sel.value = 18;
        container.appendChild(label);
        container.appendChild(sel);
      } else if(metal === 'silver'){
        const label = document.createElement('label');
        label.textContent = 'Silver purity';
        const sel = document.createElement('select');
        sel.id = 'purity';
        [{v:925,t:'Sterling 925'},{v:990,t:'Fine 990'},{v:999,t:'Fine 999'}].forEach(function(x){
          const o=document.createElement('option');
          o.value=x.v;
          o.textContent = x.t;
          sel.appendChild(o);
        });
        container.appendChild(label);
        container.appendChild(sel);
      } else {
        const label = document.createElement('label');
        label.textContent = 'Platinum purity';
        const inp = document.createElement('input');
        inp.value = '950 (typical)';
        inp.readOnly = true;
        container.appendChild(label);
        container.appendChild(inp);
      }
    }

    function getMetalPricePerGram(){
      const metal = document.getElementById('metal').value;
      if(metal === 'gold'){
        const karat = Number(document.getElementById('karat').value || 18);
        return BASE.gold24 * (karat/24);
      }
      if(metal === 'silver'){
        const purity = Number(document.getElementById('purity').value || 999);
        return BASE.silver * (purity/1000);
      }
      return BASE.platinum;
    }

    const DIAMOND_SECTION_NAMES = ['Main Diamond', 'Diamond 2', 'Diamond 3', 'Diamond 4'];

    // Populate every diamond carat dropdown from the centralized carat list.
    // A "None" option (value 0) is included so unused diamond sections cost nothing.
    function populateDiamondCarats(){
      document.querySelectorAll('.diamond-carat').forEach(function(sel){
        var current = sel.value;
        sel.innerHTML = '';
        var none = document.createElement('option');
        none.value = '0';
        none.textContent = 'None';
        sel.appendChild(none);
        DIAMOND_CARATS.forEach(function(c){
          var o = document.createElement('option');
          o.value = c;
          o.textContent = c;
          sel.appendChild(o);
        });
        if(current){ sel.value = current; }
      });
    }

    // Read the four diamond sections (quality / carat / quantity) into an array.
    // Carat sizes with a `null` price (unpriced) are flagged via `unpriced: true`
    // instead of silently costing £0.
    function getDiamondEntries(){
      var entries = [];
      for(var i = 0; i < 4; i++){
        var q = document.getElementById('dq' + i).value;
        var c = document.getElementById('dc' + i).value || '0';
        var qty = Number(document.getElementById('dqt' + i).value) || 0;
        var caratNum = Number(c) || 0;
        var price = 0;
        var unpriced = false;
        if(caratNum > 0){
          var tierPrices = DIAMOND_PRICES[q] || {};
          var rawPrice = tierPrices[c];
          if(rawPrice === null || rawPrice === undefined){
            unpriced = true;
            price = 0;
          } else {
            price = rawPrice;
          }
        }
        entries.push({
          quality: q,
          carat: c,
          caratNum: caratNum,
          qty: qty,
          price: price,
          unpriced: unpriced,
          total: price * qty
        });
      }
      return entries;
    }

    // Single source of truth for the whole pricing calculation.
    // Returns null if no product is available.
    // Returns { priceOnRequest: true, prod, tierKey, type } for types that are
    // never auto-calculated (tiara / brooch) — no numbers are computed for these.
    //
    // HYBRID PRICING MODEL (for calculable types):
    //   designComplexityFee = design/labor complexity fee, looked up by tier + metal type
    //   materialCost        = actual gold/silver/platinum weight (g) x price per gram
    //   ringPrice            = designComplexityFee + materialCost   <-- the "base price"
    function computePricing(){
      const products = getProductsForCurrentSelections();
      const pid = document.getElementById('product').value;
      const prod = products.find(function(p){ return p.id === pid; }) || products[0];
      if(!prod) return null;

      const collection = document.getElementById('collection').value;
      const tierKey = getProductInherentTier(collection, prod.id) || 'essentials';

      // Bespoke/one-off types are never auto-calculated — always quoted manually.
      if(isNonCalculatedType(prod.type)){
        return {
          priceOnRequest: true,
          prod: prod,
          collection: collection,
          tierKey: tierKey,
          type: prod.type
        };
      }

      // Design/labor fee package selection.
      // Base package comes from the product's tier, but jewelry type overrides it:
      //   - Necklaces always use the Signature design fee
      //   - Bracelets always use the Essential (basic) design fee
      let packageKey = TIER_TO_PACKAGE[tierKey] || 'basic';
      if(prod.type === 'necklace'){
        packageKey = 'signature';
      } else if(prod.type === 'bracelet'){
        packageKey = 'basic';
      }
      const metal = document.getElementById('metal').value;

      // Determine metal key for the design-fee lookup
      let metalKey;
      if(metal === 'platinum'){
        metalKey = 'platinum';
      } else if(metal === 'gold'){
        metalKey = document.getElementById('karat').value + 'K';
      } else {
        metalKey = '9K';
      }

      // Design/labor fee from the tier matrix (complexity only, no metal cost baked in)
      const designComplexityFee = (PRICING_PACKAGE_MATRIX[packageKey] && PRICING_PACKAGE_MATRIX[packageKey][metalKey]) || 0;

      // Material cost = actual weight of THIS product x price per gram of the chosen metal/purity
      const pricePerGram = getMetalPricePerGram();
      const weightGrams = Number(prod.weight) || 0;
      const materialCost = weightGrams * pricePerGram;

      // Combined base "ring price" used in the rest of the calculation
      const ringPrice = designComplexityFee + materialCost;

      // Sum the cost of every diamond entry: (price per stone x quantity)
      const entries = getDiamondEntries();
      let diamondPrice = 0;
      let hasUnpricedDiamond = false;
      entries.forEach(function(e){
        diamondPrice += e.total;
        if(e.caratNum > 0 && e.unpriced) hasUnpricedDiamond = true;
      });

      const qty = Number(document.getElementById('quantity').value) || 1;
      const profitPct = Number(document.getElementById('profit').value) || 0;
      const designFee = Number(document.getElementById('designFee').value) || 0;

      // Discount is clamped to 0–100 and applied to the final calculated price.
      let discount = Number(document.getElementById('discount').value) || 0;
      discount = Math.min(Math.max(discount, 0), 100);

      const subtotal = ringPrice + diamondPrice + designFee;
      const profitAmount = subtotal * (profitPct / 100);
      const unitTotal = subtotal + profitAmount;
      const grandTotal = unitTotal * qty;
      const discountAmount = grandTotal * (discount / 100);
      const finalTotal = grandTotal - discountAmount;

      return {
        priceOnRequest: false,
        prod: prod,
        collection: collection,
        tierKey: tierKey,
        packageKey: packageKey,
        metal: metal,
        metalKey: metalKey,
        designComplexityFee: designComplexityFee,
        pricePerGram: pricePerGram,
        weightGrams: weightGrams,
        materialCost: materialCost,
        ringPrice: ringPrice,
        entries: entries,
        diamondPrice: diamondPrice,
        hasUnpricedDiamond: hasUnpricedDiamond,
        qty: qty,
        profitPct: profitPct,
        designFee: designFee,
        discount: discount,
        subtotal: subtotal,
        profitAmount: profitAmount,
        unitTotal: unitTotal,
        grandTotal: grandTotal,
        discountAmount: discountAmount,
        finalTotal: finalTotal
      };
    }

    // Live total shown under the buttons; refreshes on any input/select change.
    function updateLiveTotal(){
      const el = document.getElementById('liveTotal');
      if(!el) return;
      const p = computePricing();
      if(!p){ el.textContent = ''; return; }
      if(p.priceOnRequest){
        el.textContent = (TYPE_LABELS[p.type] || 'This piece') + ' is priced on request — not auto-calculated.';
        return;
      }
      var text = 'Estimated total: ' + formatGBP(p.finalTotal);
      if(p.discount > 0){
        text += ' (after ' + p.discount + '% discount)';
      }
      if(p.hasUnpricedDiamond){
        text += ' — ⚠ one or more diamonds have no set price yet';
      }
      el.textContent = text;
    }

    function buildResultMarkup(prod, p){
      const collectionName = getCollectionName(p.collection);
      const tierInfo = TIERS[p.tierKey];
      const metal = p.metal;
      const metalLabel = metal === 'gold' ? document.getElementById('karat').value + 'K gold' : (metal === 'silver' ? document.getElementById('purity').value + ' silver' : '950 platinum');
      const qualityLabels = { luxe: 'Luxe', select: 'Select' };

      var html = '<div class="result-tier-badge" style="--tier-color:' + tierInfo.color + '">' + tierInfo.label + '</div>' +
        '<div><strong>Collection:</strong> ' + collectionName + '</div>' +
        '<div><strong>Product:</strong> ' + prod.name + '</div>' +
        '<div><strong>Model name:</strong> ' + (document.getElementById('modelName').value.trim() || '(none)') + '</div>' +
        '<div><strong>Metal:</strong> ' + metalLabel + '</div>' +
        '<div><strong>Design/labor fee:</strong> ' + formatGBP(p.designComplexityFee) + '</div>' +
        '<div><strong>Material cost (' + p.weightGrams + 'g x ' + formatGBP(p.pricePerGram) + '/g):</strong> ' + formatGBP(p.materialCost) + '</div>' +
        '<div><strong>Base price (design + material):</strong> ' + formatGBP(p.ringPrice) + '</div>';

      // List each non-empty diamond entry
      p.entries.forEach(function(e, idx){
        if(e.caratNum > 0){
          if(e.unpriced){
            html += '<div class="small"><strong>' + DIAMOND_SECTION_NAMES[idx] + ':</strong> ' + qualityLabels[e.quality] + ', ' + e.carat + ' ct × ' + e.qty + ' — ⚠ price not set for this size, contact us for a quote</div>';
          } else {
            html += '<div class="small"><strong>' + DIAMOND_SECTION_NAMES[idx] + ':</strong> ' + qualityLabels[e.quality] + ', ' + e.carat + ' ct × ' + e.qty + ' = ' + formatGBP(e.total) + '</div>';
          }
        }
      });

      // For earrings, show diamond weight per earring and per pair
      if(prod.type === 'earrings'){
        var totalCts = 0;
        p.entries.forEach(function(e){
          if(e.caratNum > 0) totalCts += e.caratNum * e.qty;
        });
        if(totalCts > 0){
          html += '<div class="small"><strong>Diamond weight:</strong> ' + (totalCts / 2) + ' ct per earring / ' + totalCts + ' ct per pair</div>';
        }
      }

      html += '<div><strong>Diamond cost (all):</strong> ' + formatGBP(p.diamondPrice) + '</div><hr />' +
        (p.designFee > 0 ? '<div><strong>Design customization:</strong> ' + formatGBP(p.designFee) + '</div>' : '') +
        '<div><strong>Subtotal (per unit):</strong> ' + formatGBP(p.subtotal) + '</div>' +
        '<div><strong>Profit (' + p.profitPct + '%):</strong> ' + formatGBP(p.profitAmount) + '</div>' +
        '<div><strong>Unit total:</strong> ' + formatGBP(p.unitTotal) + '</div>' +
        '<div><strong>Quantity:</strong> ' + p.qty + '</div>' +
        '<div><strong>Total before discount:</strong> ' + formatGBP(p.grandTotal) + '</div>';

      if(p.discount > 0){
        html += '<div><strong>Discount (' + p.discount + '%):</strong> −' + formatGBP(p.discountAmount) + '</div>';
      }

      html += '<div style="font-size:1.1rem;margin-top:12px"><strong>Final total: ' + formatGBP(p.finalTotal) + '</strong></div>' +
        '<div class="small" style="margin-top:8px">Notes: ' + (document.getElementById('notes').value.trim() || '-') + '</div>';
      return html;
    }

    function buildPriceOnRequestMarkup(prod, p){
      const collectionName = getCollectionName(p.collection);
      const tierInfo = TIERS[p.tierKey];
      const typeLabel = TYPE_LABELS[p.type] || 'This item';
      return '<div class="result-tier-badge" style="--tier-color:' + tierInfo.color + '">' + tierInfo.label + '</div>' +
        '<div><strong>Collection:</strong> ' + collectionName + '</div>' +
        '<div><strong>Product:</strong> ' + prod.name + '</div>' +
        '<div><strong>Type:</strong> ' + typeLabel + '</div>' +
        '<hr />' +
        '<div><strong>⚠ Price on request</strong></div>' +
        '<div class="small" style="margin-top:6px">' + typeLabel + ' pieces are bespoke and are always quoted manually by our team — they are not covered by the automatic calculator. Please contact us with your requirements for a custom quote.</div>' +
        '<div class="small" style="margin-top:8px">Notes: ' + (document.getElementById('notes').value.trim() || '-') + '</div>';
    }

    function buildBreakdownMarkup(metalLabel, p){
      const packageLabels = { basic: 'Basic design', signature: 'Signature design', atelier: 'Atelier design' };
      const qualityLabels = { luxe: 'Luxe', select: 'Select' };
      let lines = '<div class="breakdown-title">How this was calculated</div>';
      lines += '<div class="breakdown-line"><span>Design/labor fee — ' + (packageLabels[p.packageKey] || p.packageKey) + '</span><span>' + formatGBP(p.designComplexityFee) + '</span></div>';
      lines += '<div class="breakdown-line"><span>Material — ' + metalLabel + ', ' + p.weightGrams + 'g</span><span>' + formatGBP(p.materialCost) + '</span></div>';
      p.entries.forEach(function(e, idx){
        if(e.caratNum > 0){
          if(e.unpriced){
            lines += '<div class="breakdown-line"><span>' + DIAMOND_SECTION_NAMES[idx] + ' — ' + qualityLabels[e.quality] + ', ' + e.carat + 'ct × ' + e.qty + '</span><span>⚠ unpriced</span></div>';
          } else {
            lines += '<div class="breakdown-line"><span>' + DIAMOND_SECTION_NAMES[idx] + ' — ' + qualityLabels[e.quality] + ', ' + e.carat + 'ct × ' + e.qty + '</span><span>' + formatGBP(e.total) + '</span></div>';
          }
        }
      });
      if(p.designFee > 0){
        lines += '<div class="breakdown-line"><span>Design customization</span><span>' + formatGBP(p.designFee) + '</span></div>';
      }
      lines += '<hr />';
      lines += '<div class="breakdown-formula">Base price = ' + formatGBP(p.designComplexityFee) + ' (design) + ' + formatGBP(p.materialCost) + ' (material) = <strong>' + formatGBP(p.ringPrice) + '</strong></div>';
      lines += '<div class="breakdown-formula">Subtotal = ' + formatGBP(p.ringPrice) + ' + ' + formatGBP(p.diamondPrice) + (p.designFee > 0 ? ' + ' + formatGBP(p.designFee) : '') + ' = <strong>' + formatGBP(p.subtotal) + '</strong></div>';
      lines += '<div class="breakdown-formula">Profit (' + p.profitPct + '%) = ' + formatGBP(p.subtotal) + ' × ' + p.profitPct + '% = <strong>' + formatGBP(p.profitAmount) + '</strong></div>';
      lines += '<div class="breakdown-formula">Unit total = ' + formatGBP(p.subtotal) + ' + ' + formatGBP(p.profitAmount) + ' = <strong>' + formatGBP(p.unitTotal) + '</strong></div>';
      lines += '<div class="breakdown-formula">Grand total = ' + formatGBP(p.unitTotal) + ' × ' + p.qty + ' = <strong>' + formatGBP(p.grandTotal) + '</strong></div>';
      if(p.discount > 0){
        lines += '<div class="breakdown-formula">Discount (' + p.discount + '%) = ' + formatGBP(p.grandTotal) + ' × ' + p.discount + '% = −<strong>' + formatGBP(p.discountAmount) + '</strong></div>';
        lines += '<div class="breakdown-formula">Final total = ' + formatGBP(p.grandTotal) + ' − ' + formatGBP(p.discountAmount) + ' = <strong>' + formatGBP(p.finalTotal) + '</strong></div>';
      } else {
        lines += '<div class="breakdown-formula">Final total = <strong>' + formatGBP(p.finalTotal) + '</strong></div>';
      }
      return lines;
    }

    function calculate(){
      const p = computePricing();
      if(!p) return;

      const proceedBtn = document.getElementById('proceedPaymentFromPopup');
      const breakdownBtn = document.getElementById('checkBreakdownBtn');
      const breakdownPanel = document.getElementById('priceBreakdown');

      if(p.priceOnRequest){
        currentOrderTotal = 0;
        currentIsPriceOnRequest = true;

        const out = document.getElementById('out');
        out.innerHTML = '<div class="muted">This piece is priced on request — see the summary window.</div>';

        const popupBody = document.getElementById('resultPopupBody');
        popupBody.innerHTML = buildPriceOnRequestMarkup(p.prod, p);

        breakdownPanel.hidden = true;
        breakdownPanel.innerHTML = '';
        breakdownBtn.hidden = true;

        proceedBtn.disabled = true;
        proceedBtn.textContent = 'Contact us for a quote';

        document.getElementById('resultPopup').hidden = false;
        document.getElementById('totalPrice').textContent = 'On request';
        return;
      }

      currentOrderTotal = p.finalTotal;
      currentIsPriceOnRequest = false;

      const out = document.getElementById('out');
      out.innerHTML = '<div class="muted">Your quote is ready in the floating summary window.</div>';

      const popupBody = document.getElementById('resultPopupBody');
      popupBody.innerHTML = buildResultMarkup(p.prod, p);

      const metalLabel = p.metal === 'gold' ? document.getElementById('karat').value + 'K gold' : (p.metal === 'silver' ? document.getElementById('purity').value + ' silver' : '950 platinum');
      breakdownPanel.innerHTML = buildBreakdownMarkup(metalLabel, p);
      breakdownPanel.hidden = true;
      breakdownBtn.hidden = false;
      breakdownBtn.textContent = 'Check breakdown';

      proceedBtn.disabled = false;
      proceedBtn.textContent = 'Proceed to Payment';

      document.getElementById('resultPopup').hidden = false;
      document.getElementById('totalPrice').textContent = formatGBP(p.finalTotal);
    }

    function toggleBreakdown(){
      const panel = document.getElementById('priceBreakdown');
      const btn = document.getElementById('checkBreakdownBtn');
      panel.hidden = !panel.hidden;
      btn.textContent = panel.hidden ? 'Check breakdown' : 'Hide breakdown';
    }

    function closeResultPopup(){
      document.getElementById('resultPopup').hidden = true;
    }

    // Reset a single diamond section (index 0–3) to its defaults:
    // Main Diamond = Select, 1.00 ct, qty 1; others = Select, None, qty 1.
    function resetDiamondSection(i){
      document.getElementById('dq' + i).value = 'select';
      document.getElementById('dc' + i).value = i === 0 ? '1.00' : '0';
      document.getElementById('dqt' + i).value = '1';
      updateLiveTotal();
    }

    function resetAll(){
      document.getElementById('collection').value = 'dailySparkle';
      document.getElementById('typeFilter').value = 'all';
      populateProducts();
      document.getElementById('metal').value = 'gold';
      renderMetalExtras();
      // Reset all four diamond sections to defaults (Main = Select 1.00 ct, others = None)
      for(var i = 0; i < 4; i++){
        resetDiamondSection(i);
      }
      document.getElementById('quantity').value = '1';
      document.getElementById('discount').value = '0';
      document.getElementById('profit').value = '20';
      document.getElementById('notes').value = '';
      document.getElementById('designFee').value = '0';
      document.getElementById('out').innerHTML = '<div class="muted">Choose product and options, then press Calculate.</div>';
      closeResultPopup();
      currentOrderTotal = 0;
      currentIsPriceOnRequest = false;
      const proceedBtn = document.getElementById('proceedPaymentFromPopup');
      proceedBtn.disabled = false;
      proceedBtn.textContent = 'Proceed to Payment';
      document.getElementById('checkBreakdownBtn').hidden = false;
      renderTierBadge();
      updateModelName();
      updateLiveTotal();
    }

    function openPaymentModal(){
      if(currentIsPriceOnRequest) return; // safety guard — should already be disabled
      closeResultPopup();
      document.getElementById('paymentModal').classList.add('open');
      document.getElementById('totalPrice').textContent = formatGBP(currentOrderTotal);
    }

    function closePaymentModal(){
      document.getElementById('paymentModal').classList.remove('open');
      document.getElementById('paymentStatus').textContent = '';
      document.getElementById('fullName').value = '';
      document.getElementById('email').value = '';
      const cardName = document.getElementById('cardName');
      if(cardName){ cardName.value = ''; }
      const cardNumber = document.getElementById('cardNumber');
      if(cardNumber){ cardNumber.value = ''; }
      const expiry = document.getElementById('expiry');
      if(expiry){ expiry.value = ''; }
      const cvc = document.getElementById('cvc');
      if(cvc){ cvc.value = ''; }
    }

    async function processPayment(){
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const status = document.getElementById('paymentStatus');
      if(!name || !email){ status.textContent = 'Please enter name and email.'; return; }

      const amountText = document.getElementById('totalPrice').textContent.replace(/[^0-9.,]/g,'').replace(',','.');
      const amount = Math.round(parseFloat(amountText) * 100);
      const collectionName = getCollectionName(document.getElementById('collection').value);
      const productName = collectionName + ' — ' + ((document.querySelector('#product option:checked')||{}).textContent || 'Jewelry');
      const quantity = Number(document.getElementById('quantity').value) || 1;

      status.textContent = 'Opening Stripe Checkout…';

      try{
        const resp = await fetch('/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, productName, quantity })
        });
        const json = await resp.json();
        if(json.url){ window.location = json.url; }
        else { status.textContent = 'Failed to create checkout session.'; }
      }catch(err){
        console.error(err);
        status.textContent = 'Error contacting server: '+err.message;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Populate carat dropdowns first so product diamond presets can be applied on load
      populateDiamondCarats();
      populateProducts();
      renderMetalExtras();
      updateLiveTotal();

      document.getElementById('collection').addEventListener('change', function() {
        populateProducts();
        updateLiveTotal();
      });
      document.getElementById('typeFilter').addEventListener('change', function() {
        populateProducts();
        updateLiveTotal();
      });
      document.getElementById('product').addEventListener('change', function() {
        renderProductInfo();
        updateLiveTotal();
      });
      document.getElementById('metal').addEventListener('change', function() {
        renderMetalExtras();
        updateLiveTotal();
      });

      // Live total updates for all order/discount/design inputs
      ['quantity','discount','profit','designFee'].forEach(function(id){
        document.getElementById(id).addEventListener('input', updateLiveTotal);
        document.getElementById(id).addEventListener('change', updateLiveTotal);
      });

      // Live total updates for diamond sections
      for(var i = 0; i < 4; i++){
        document.getElementById('dq' + i).addEventListener('change', updateLiveTotal);
        document.getElementById('dc' + i).addEventListener('change', updateLiveTotal);
        document.getElementById('dqt' + i).addEventListener('input', updateLiveTotal);
        document.getElementById('dqt' + i).addEventListener('change', updateLiveTotal);
      }

      // Karat / purity controls are regenerated inside #metalExtras, so listen on the container
      document.getElementById('metalExtras').addEventListener('change', updateLiveTotal);

      // Per-diamond reset buttons (small ↺ in each diamond section title)
      document.querySelectorAll('.diamond-reset').forEach(function(btn){
        btn.addEventListener('click', function(){
          resetDiamondSection(Number(btn.dataset.index));
        });
      });

      document.getElementById('calc').addEventListener('click', calculate);
      document.getElementById('reset').addEventListener('click', resetAll);

      document.getElementById('proceedPaymentFromPopup').addEventListener('click', openPaymentModal);
      document.getElementById('closeResultPopup').addEventListener('click', closeResultPopup);
      document.getElementById('checkBreakdownBtn').addEventListener('click', toggleBreakdown);
      document.getElementById('resultPopup').addEventListener('click', function(event) {
        if(event.target.id === 'resultPopup') closeResultPopup();
      });

      document.getElementById('closeModal').addEventListener('click', closePaymentModal);
      document.getElementById('cancelCheckout').addEventListener('click', closePaymentModal);
      document.getElementById('submitPayment').addEventListener('click', processPayment);
    });
  </script>
</body>
</html>
